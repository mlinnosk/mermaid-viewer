[package]
name = "mermaid-viewer-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Core library for mermaid-viewer: Mermaid to SVG/PNG rendering, raylib-based diagram window, and stdio MCP server."

[dependencies]
mermaid-render = "0.10"
resvg = "0.48"
thiserror = "2"
# PNG encoder for the rasterization step (M-2 contract card: builder's
# choice). Already in the dependency graph via `usvg`; adding it as a
# direct dependency does not change the lockfile footprint.
png = "0.18"
# The `raygui` feature enables the immediate-mode tab-bar UI (`gui_tab_bar`)
# drawn by the controller window; both backend builds must compile the same UI
# code, so the feature is enabled on both the OpenGL and software-renderer
# configurations. `default-features = false` mirrors the `raylib-sw` feature
# set (the same UI code must build under both backends) and drops the
# default `USE_AUDIO`/`SUPPORT_MODULE_RAUDIO`: the application never uses
# audio, and without them raylib's C build compiles no miniaudio — which
# matters on macOS, where raylib-sys 6.0.0's build script omits the
# CoreAudio/AudioToolbox frameworks that a miniaudio build references.
#
# Dropped-module linking: with the models/audio C modules off, the safe
# crate's `core::models`/`core::audio` FFI stubs reference C symbols the
# library does not define. Linux/macOS linkers drop those references;
# MSVC's link.exe does not (LNK1120). The workaround —
# `cargo:rustc-link-arg=/FORCE:UNRESOLVED`, which raylib-sys's own build
# script prescribes for custom builds that turn off modules — is emitted
# by *two* build scripts: this package's `build.rs` covers this
# package's own link targets (in particular the integration-test
# executables, which link the `raylib` rlib), and the
# `mermaid-viewer` binary crate's `build.rs` covers the binary (and its
# tests). Cargo applies `rustc-link-arg` only from the build script of
# the package whose target is being linked, so each link needs the flag
# from its own package's build script.
#
# (The `release_with_debug_info` feature, which would also fix the
# LNK4098 debug-CRT warning, is unusable: raylib-sys 6.0.0's build
# script assigns its `profile` variable twice when it is enabled and
# fails to compile with E0384. The LNK4098 warning is non-fatal, and
# the /MDd-vs-/MD mix is safe here because the Rust↔C boundary passes
# only POD types.)
raylib-ogl = { package = "raylib", version = "6.0", default-features = false, features = [
    "raygui",
    "GLFW_BUILD_X11",
    "SUPPORT_MODULE_RSHAPES",
    "SUPPORT_MODULE_RTEXT",
    "SUPPORT_MODULE_RTEXTURES",
    "SUPPORT_IMAGE_GENERATION",
], optional = true }
raylib-sw = { package = "raylib", version = "6.0", default-features = false, features = [
    "software_renderer",
    "raygui",
    "SUPPORT_MODULE_RSHAPES",
    "SUPPORT_MODULE_RTEXT",
    "SUPPORT_MODULE_RTEXTURES",
    "SUPPORT_IMAGE_GENERATION",
], optional = true }
# `macros` enables the `#[tool_router]`/`#[tool]` code generation used by
# the `mcp` module (the `server` feature alone does not include it).
rmcp = { version = "3.5", features = ["server", "macros"], optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "io-std", "signal"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
# The `#[derive(JsonSchema)]` on the MCP tool parameter types emits code
# against the `::schemars` crate, so it must be a direct dependency.
schemars = { version = "1.2", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"

[features]
default = ["view", "mcp"]
view = ["dep:raylib-ogl"]
view-headless = ["dep:raylib-sw"]
mcp = ["dep:rmcp", "dep:tokio", "dep:serde", "dep:schemars"]
